name: Lean build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lean build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The runner's default free space is not enough for the Mathlib cache plus this build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Keep the swap file: the largest files peak at several GB of memory on the runner.
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          # Fetch the Mathlib build cache instead of compiling Mathlib from source.
          use-mathlib-cache: true

name: Lean build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lean build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          # Fetch the Mathlib build cache instead of compiling Mathlib from source.
          use-mathlib-cache: true

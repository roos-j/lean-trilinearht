status:
  scope: >-
    Complete for Theorem 1.1 of the preprint, with no unproved step: there is a real C such that
    for all Schwartz functions f : Fin 3 -> S(R, C), the L^1 norm of T(f) is at most
    ENNReal.ofReal C times the product of the L^3 norms of the f i. T is the principal value,
    taken with Mathlib's limUnder as epsilon -> 0+, of the integrals over |t| > epsilon; that this
    limit exists for Schwartz functions is proved separately (Auto.tendsto_T_trunc) but is not
    part of the compared statement. 
  sorry_count: 0
  sorry_in_definitions: 0

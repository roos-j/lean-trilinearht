fidelity:
  divergences: >-
    The preprint defines T(f1, f2, f3)(x) as the principal value of the integral of
    f1(x - t) f2(x - 2t) f3(x - 3t) dt / t, while TrilinearHT.T integrates
    f 0 (x + t) f 1 (x + 2t) f 2 (x + 3t) dt / t; the two operators differ only by a sign, so the
    bound is the same. The formal statement is the a priori estimate for Schwartz functions, as in
    Theorem 1.1; the extension to L^3 that the preprint draws from it is not formalized. The
    principal value is defined with limUnder, which takes an arbitrary value where the limit does
    not exist; for Schwartz functions it exists (Auto.tendsto_T_trunc). Discrepancies between the
    blueprint and the Lean development were recorded by the coding agents in
    automation/ErrorReport.md and have not been reviewed by a human.

